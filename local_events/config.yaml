age_range:
  min: 5
  max: 13

lookahead_days: 90

output_path: ~/Dropbox/claude/calendars/local-events.ics
cache_dir: ~/scripts/local-events/cache
log_path: ~/Library/Logs/local-events-sync.log

# Empty-source alarm: alert if today's count is 0 and yesterday's was >= this value
empty_source_alarm_threshold: 2

sources:
  smcl:
    enabled: true
    # BiblioCommons library slug (smcl = San Mateo County Libraries)
    library: smcl
    # Branches to include, mapped to city tag. Belmont and San Carlos disabled
    # by user request. Downtown RWC library is NOT in the SMCL system — it's
    # part of Redwood City Public Library (separate scraper, in progress).
    branches:
      Atherton: ATH
  sanmateopl:
    enabled: false  # San Mateo library disabled by user request
    ics_urls:
      - "https://sanmateopublic.libcal.com/ical_subscribe.php?src=p&cid=16089"
    city_tag: SM
  rcpl:
    enabled: false  # Downtown RWC library — skipped per user (CDN-blocked)
    city_tag: RWC
  menlopark:
    enabled: true
    city_tag: MP
  paloalto:
    enabled: false  # not requested
    city_tag: PA
  curiodyssey:
    enabled: true
    city_tag: SM
  smcas:
    enabled: true
    city_tag: SC
  bayareakidfun:
    enabled: true
    # City tag comes from parsed city name (per-event); no default here.
