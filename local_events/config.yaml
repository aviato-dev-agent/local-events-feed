age_range:
  min: 5
  max: 13

lookahead_days: 180

output_path: ~/Dropbox/claude/calendars/local-events.ics
volunteer_output_path: ~/Dropbox/claude/calendars/volunteer-events.ics
sports_output_path: ~/Dropbox/claude/calendars/college-sports.ics
cache_dir: ~/scripts/local-events/cache
log_path: ~/Library/Logs/local-events-sync.log

# Empty-source alarm: alert if today's count is 0 and yesterday's was >= this value
empty_source_alarm_threshold: 2

sources:
  smcl:
    enabled: true
    # BiblioCommons library slug (smcl = San Mateo County Libraries)
    library: smcl
    # Branches to include, mapped to city tag. Belmont and San Carlos disabled
    # by user request. Downtown RWC library is NOT in the SMCL system — it's
    # part of Redwood City Public Library (separate scraper, in progress).
    branches:
      Atherton: ATH
  sanmateopl:
    enabled: false  # San Mateo library disabled by user request
    ics_urls:
      - "https://sanmateopublic.libcal.com/ical_subscribe.php?src=p&cid=16089"
    city_tag: SM
  rcpl:
    enabled: false  # Downtown RWC library — skipped per user (CDN-blocked)
    city_tag: RWC
  menlopark:
    enabled: true
    city_tag: MP
  paloalto:
    enabled: false  # not requested
    city_tag: PA
  curiodyssey:
    enabled: true
    city_tag: SM
  smcas:
    enabled: true
    city_tag: SC
  bayareakidfun:
    enabled: true
    # City tag comes from parsed city name (per-event); no default here.
  menlopark_city:
    enabled: true
    city_tag: MP
  sancarlos:
    enabled: true
    city_tag: SC
  hiller:
    enabled: true
    city_tag: SC
  hiddenvilla:
    enabled: true
    city_tag: LAH
  filoli:
    enabled: true
    city_tag: WS
  littlegreen:
    enabled: true
    city_tag: RWC
  thehub:
    enabled: true
    city_tag: RWC
  townandcountry:
    enabled: true
    city_tag: PA
  citytrees:
    enabled: true
    city_tag: RWC
    is_volunteer_source: true
  grassrootsecology:
    enabled: true
    city_tag: PA
    is_volunteer_source: true
  savethebay:
    enabled: true
    city_tag: PA
    is_volunteer_source: true
  canopy:
    enabled: false  # disabled 2026-07-13: canopy.org returns 403 to GHA runner IPs.
                     # Not worth the scrape.do budget for marginal PA/EPA tree-planting
                     # coverage beyond what CityTrees already provides in RWC.
    city_tag: PA
    is_volunteer_source: true
  flowstobay:
    enabled: true
    city_tag: SM
    is_volunteer_source: true
  pacificbeach:
    enabled: true
    city_tag: PAC
    is_volunteer_source: true
  static_recurring:
    enabled: true
    city_tag: PA
    is_volunteer_source: true
  msi:
    enabled: true
    city_tag: SM
  rwc:
    enabled: true
    city_tag: RWC
    # Scrapes redwoodcity.org via scrape.do (residential proxy + headless Chrome).
    # API token must be set in SCRAPE_DO_TOKEN env var / GHA secret.
    # Fetches current month + next month = ~10 credits/run, ~300/month.
  stanford:
    enabled: true
    # Empty city_tag: normalizer skips the "[TAG] " prefix so titles read
    # "Stanford vs. Opponent [Sport]" without a redundant "[STAN]".
    city_tag: ""
    is_sports_source: true
    # Home games only — scraper filters by "Stanford vs." in SUMMARY.
    # Per-sport venue lookup lives in scrapers/stanford.py::_VENUES.
  stanford_campus:
    enabled: true
    city_tag: ""
    is_stanford_source: true
    # Sources: Localist API (events.stanford.edu), Stanford Law ICS, Economics seminar ICS feeds.
    # Summer (July–Aug) will produce few or zero Localist events; that's expected.
    # Output: stanford_campus.ics
