name: sync

on:
  schedule:
    # 13:00 UTC = 6am PDT / 5am PST. Runs once a day.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate ICS
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python -m local_events.sync --out local-events.ics --volunteer-out volunteer-events.ics --sports-out college-sports.ics --adult-out adult-events.ics

      - name: Commit if changed
        run: |
          git config user.name "aviato-dev-agent[bot]"
          git config user.email "bot@aviato-dev-agent.users.noreply.github.com"
          any_committed=0
          for f in local-events.ics volunteer-events.ics college-sports.ics adult-events.ics; do
            git add "$f"
            if git diff --cached --quiet -- "$f"; then
              echo "No changes to $f."
              continue
            fi
            # Ignore DTSTAMP-only churn
            changed_lines=$(git diff --cached -U0 -- "$f" \
              | grep -E '^[+-]' \
              | grep -vE '^[+-]{3}' \
              | grep -vE '^[+-]DTSTAMP:' \
              | wc -l)
            if [ "$changed_lines" -gt 0 ]; then
              git commit -m "sync $f: $(date -u +%F) (${changed_lines} lines changed)"
              any_committed=1
            else
              echo "Only DTSTAMP churn on $f; skipping commit."
              git reset HEAD -- "$f"
            fi
          done
          if [ "$any_committed" = "1" ]; then
            git push
          fi
